<!DOCTYPE html>
<html lang="lo">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ລະບົບຈັດການອໍເດີ້ (Admin)</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+Lao:wght@300;400;500;600;700&display=swap');
        
        * { box-sizing: border-box; font-family: 'Phetsarath OT', 'Noto Sans Lao', sans-serif; }
        body { background-color: #f0f2f5; margin: 0; padding: 20px; color: #333; }
        
        .admin-header {
            background: linear-gradient(135deg, #1e293b, #0f172a);
            color: white; padding: 20px 25px; border-radius: 12px; margin-bottom: 20px;
            display: flex; justify-content: space-between; align-items: center;
        }
        .admin-header h1 { margin: 0; font-size: 1.5rem; }
        .btn-history { background-color: #3b82f6; color: white; padding: 8px 16px; border-radius: 6px; text-decoration: none; font-size: 0.9rem; font-weight: 500; }

        .dashboard-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        @media (max-width: 900px) { .dashboard-grid { grid-template-columns: 1fr; } }

        .panel { background: white; border-radius: 12px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        .panel-title { margin-top: 0; margin-bottom: 15px; padding-bottom: 10px; border-bottom: 2px solid #e2e8f0; font-size: 1.2rem; font-weight: 600; }

        .order-card { border: 1px solid #e2e8f0; border-radius: 10px; padding: 15px; margin-bottom: 15px; background: #ffffff; }
        .card-header { display: flex; justify-content: space-between; margin-bottom: 10px; border-bottom: 1px dashed #cbd5e1; padding-bottom: 6px; }
        .table-number { font-size: 1.1rem; font-weight: 700; }

        .type-food { border-left: 6px solid #dc2626; }
        .type-call { border-left: 6px solid #f59e0b; background: #fffbeb; }
        .type-bill { border-left: 6px solid #10b981; background: #ecfdf5; }

        .item-list { list-style: none; padding: 0; margin: 10px 0; }
        .item-list li { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid #f1f5f9; }

        .btn-group { display: flex; gap: 8px; margin-top: 10px; }
        .btn { padding: 8px 12px; border: none; border-radius: 6px; cursor: pointer; font-size: 0.85rem; font-weight: 600; flex: 1; }
        .btn-serve { background-color: #10b981; color: white; }
        .btn-delete { background-color: #ef4444; color: white; }

        .empty-state { text-align: center; color: #94a3b8; padding: 40px; }
    </style>
</head>
<body>

    <div class="admin-header">
        <h1>👨‍🍳 ລະບົບຈັດການອໍເດີ້ & ຫ້ອງຄົວ</h1>
        <a href="history.html" class="btn-history">📜 ປະວັດປະວັດທຸລະກຳ</a>
    </div>

    <div class="dashboard-grid">
        <div class="panel">
            <div class="panel-title">🍱 รายการสั่งอาหาร (ห้องครัว)</div>
            <div id="food-orders-container"><div class="empty-state">ຍັງບໍ່ມີອໍເດີ້เข้ามา</div></div>
        </div>

        <div class="panel">
            <div class="panel-title">🔔 ຮຽກພະນັກງານ / ເຊັກບິນ</div>
            <div id="service-requests-container"><div class="empty-state">ຍັງບໍ່ມີการเรียก</div></div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
    <script src="admin.js"></script>
</body>
</html>
